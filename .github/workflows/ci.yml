name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Vérifie que le générateur reproduit exactement les fixtures v1 figées (sans rien écrire).
      - run: npx vitest run tests/save/fixture-generate.test.ts
        env:
          CHECK_SAVE_FIXTURES: "1"
      - run: npm run build
