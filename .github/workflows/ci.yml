name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Vérifie que le générateur reproduit exactement les fixtures v1 figées (sans rien écrire).
      - run: npx vitest run tests/save/fixture-generate.test.ts
        env:
          CHECK_SAVE_FIXTURES: "1"
      # Les modèles 3D livrés (public/assets/) ne doivent pas dépasser 4 Mo.
      - run: npm run assets:size
      - run: npm run build
      # Tests de bout en bout (2D par défaut, 3D via ?render=3d, repli 2D sans WebGL).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
